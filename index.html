<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Quiz: Sprache der Neuen Rechten</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --red:      #cc0000;
      --red-dark: #9a0000;
      --bg:       #0a0a0a;
      --s1:       #141414;
      --s2:       #1e1e1e;
      --border:   #2c2c2c;
      --text:     #f5f5f5;
      --muted:    #888;
      --dim:      #555;
      --ok:       #22c55e;
      --ok-bg:    #052e16;
      --bad:      #ef4444;
      --bad-bg:   #2d0808;
      --r:        12px;
      --rs:       8px;
    }

    html, body { height: 100%; overflow-x: hidden; }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── Progress bar ── */
    #prog-track {
      position: fixed; top: 0; left: 0; right: 0;
      height: 4px; background: var(--s2); z-index: 999;
    }
    #prog-fill {
      height: 100%; background: var(--red);
      transition: width 0.5s cubic-bezier(0.4,0,0.2,1);
      border-radius: 0 2px 2px 0;
    }

    /* ── App shell ── */
    #app { position: relative; min-height: 100vh; overflow: hidden; }

    .screen {
      min-height: 100vh;
      padding: 16px 16px 48px;
      display: flex; flex-direction: column; align-items: center;
    }
    .sc { width: 100%; max-width: 560px; flex: 1; display: flex; flex-direction: column; }

    /* ── Animations ── */
    @keyframes slideIn  { from { transform: translateX(52px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    @keyframes slideOut { from { transform: translateX(0); opacity: 1; } to { transform: translateX(-52px); opacity: 0; } }
    @keyframes popIn    { from { transform: scale(0.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    @keyframes fadeUp   { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    .anim-in  { animation: slideIn  0.32s cubic-bezier(0.25,0.46,0.45,0.94) both; }
    .anim-out { animation: slideOut 0.22s ease-in both; }

    /* ══════════════════════════════════════════
       START SCREEN
    ══════════════════════════════════════════ */
    .hero { padding: 44px 0 28px; text-align: center; }

    .eyebrow {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(204,0,0,0.15); color: #ff6666;
      border: 1px solid rgba(204,0,0,0.3);
      font-size: 0.7rem; font-weight: 700; letter-spacing: 0.1em;
      text-transform: uppercase; padding: 4px 12px; border-radius: 20px;
      margin-bottom: 22px;
    }
    .hero h1 {
      font-size: clamp(2rem, 7vw, 3rem); font-weight: 800;
      line-height: 1.08; margin-bottom: 14px;
    }
    .hero h1 em { color: var(--red); font-style: normal; }
    .hero p { font-size: 1rem; color: var(--muted); line-height: 1.6; margin-bottom: 36px; }

    .sec-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 28px; }
    .sec-row {
      background: var(--s1); border: 1px solid var(--border);
      border-radius: var(--rs); padding: 13px 16px;
      display: flex; align-items: center; gap: 13px;
    }
    .sec-row-icon  { font-size: 1.4rem; flex-shrink: 0; }
    .sec-row-name  { font-size: 0.88rem; font-weight: 600; }
    .sec-row-cnt   { font-size: 0.78rem; color: var(--muted); margin-top: 1px; }
    .sec-row-badge {
      margin-left: auto; background: var(--s2); border: 1px solid var(--border);
      border-radius: 4px; font-size: 0.68rem; font-weight: 700;
      color: var(--dim); padding: 2px 7px; flex-shrink: 0;
    }

    /* ══════════════════════════════════════════
       SECTION INTRO
    ══════════════════════════════════════════ */
    .si-wrap {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center; padding: 32px 0;
    }
    .si-step {
      font-size: 0.7rem; font-weight: 700; letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--red); margin-bottom: 16px;
    }
    .si-big   { font-size: 3.5rem; margin-bottom: 18px; }
    .si-title { font-size: clamp(1.5rem, 5vw, 2.1rem); font-weight: 800; margin-bottom: 12px; }
    .si-desc  {
      font-size: 0.95rem; color: var(--muted); line-height: 1.65;
      max-width: 380px; margin-bottom: 40px;
    }
    .si-desc em { color: #ccc; font-style: normal; font-weight: 600; }

    /* ══════════════════════════════════════════
       QUESTION SCREEN
    ══════════════════════════════════════════ */
    .q-meta {
      display: flex; align-items: center; gap: 8px;
      padding: 16px 0 12px; flex-wrap: wrap;
    }
    .q-tag {
      font-size: 0.68rem; font-weight: 700; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--red);
      background: rgba(204,0,0,0.12); padding: 3px 9px; border-radius: 4px;
    }
    .q-num { font-size: 0.76rem; color: var(--muted); margin-left: auto; }

    .q-card {
      background: var(--s1); border: 1px solid var(--border);
      border-radius: var(--r); padding: 22px 20px; margin-bottom: 13px;
    }
    .q-lbl {
      font-size: 0.66rem; font-weight: 700; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--dim); margin-bottom: 10px;
    }

    /* Term (Section 1) */
    .q-term   { font-size: clamp(1.8rem,6vw,2.6rem); font-weight: 800; color: #fff; line-height: 1.1; margin-bottom: 6px; }
    .q-ctx    { font-size: 0.82rem; color: var(--muted); font-style: italic; }

    /* Media (Section 2) */
    .q-media  { font-size: 1.1rem; font-weight: 700; color: #fff; margin-bottom: 7px; }
    .q-detail { font-size: 0.84rem; color: var(--muted); line-height: 1.5; }

    /* Quote (Section 3) */
    .q-quote  {
      font-size: 0.96rem; font-weight: 500; color: #ddd;
      line-height: 1.65; font-style: italic;
      border-left: 3px solid var(--red); padding-left: 16px; margin-bottom: 10px;
    }
    .q-spkr { font-size: 0.77rem; color: var(--dim); }

    /* ── Answer options ── */
    .opts { display: flex; flex-direction: column; gap: 9px; margin-bottom: 12px; }

    .opt {
      background: var(--s1); border: 2px solid var(--border);
      border-radius: var(--rs); padding: 15px 18px;
      display: flex; align-items: center; gap: 12px;
      font-family: inherit; font-size: 0.96rem; font-weight: 600;
      color: var(--text); cursor: pointer; text-align: left;
      transition: border-color 0.15s, background 0.15s, transform 0.1s;
      -webkit-tap-highlight-color: transparent;
    }
    .opt:hover:not(:disabled) { border-color: #484848; background: var(--s2); }
    .opt:active:not(:disabled) { transform: scale(0.985); }
    .opt:disabled { cursor: default; }

    .opt-lt {
      width: 30px; height: 30px; border-radius: 50%;
      border: 2px solid var(--border); background: var(--s2);
      display: flex; align-items: center; justify-content: center;
      font-size: 0.74rem; font-weight: 800; flex-shrink: 0;
      transition: all 0.2s;
    }

    .opt.c-ok  { border-color: var(--ok);  background: var(--ok-bg); }
    .opt.c-ok  .opt-lt { background: var(--ok);  border-color: var(--ok);  color: #fff; }
    .opt.c-bad { border-color: var(--bad); background: var(--bad-bg); }
    .opt.c-bad .opt-lt { background: var(--bad); border-color: var(--bad); color: #fff; }
    .opt.c-dim { opacity: 0.3; }

    /* ── Feedback card ── */
    .fb {
      border-radius: var(--rs); padding: 15px 18px;
      margin-bottom: 11px; animation: fadeUp 0.25s ease;
    }
    .fb-ok  { background: var(--ok-bg);  border: 1px solid rgba(34,197,94,0.4); }
    .fb-bad { background: var(--bad-bg); border: 1px solid rgba(239,68,68,0.4); }
    .fb-head { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }
    .fb-head strong { font-size: 0.95rem; font-weight: 700; }
    .fb-ok  .fb-head strong { color: #4ade80; }
    .fb-bad .fb-head strong { color: #f87171; }
    .fb-txt { font-size: 0.86rem; color: #ccc; line-height: 1.6; }

    /* ══════════════════════════════════════════
       BUTTONS
    ══════════════════════════════════════════ */
    .btn {
      display: flex; align-items: center; justify-content: center;
      gap: 8px; width: 100%; padding: 17px 24px;
      border-radius: var(--rs); border: none;
      font-family: inherit; font-size: 1rem; font-weight: 700;
      cursor: pointer; transition: all 0.18s;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-red { background: var(--red); color: #fff; }
    .btn-red:hover  { background: var(--red-dark); }
    .btn-red:active { transform: scale(0.98); }

    /* ══════════════════════════════════════════
       RESULTS SCREEN
    ══════════════════════════════════════════ */
    .res-hero { text-align: center; padding: 36px 0 24px; }
    .res-emoji { font-size: 4rem; margin-bottom: 14px; animation: popIn 0.45s ease; }

    .res-score {
      font-size: clamp(3.5rem, 12vw, 5.5rem);
      font-weight: 800; line-height: 1; margin-bottom: 8px;
    }
    .res-sup  { font-size: 0.35em; color: var(--muted); font-weight: 400; }
    .res-rtg  { font-size: 1.25rem; font-weight: 700; color: #ff6666; margin-bottom: 6px; }
    .res-sub  { font-size: 0.88rem; color: var(--muted); margin-bottom: 32px; }

    .s-gold  { color: #ffd700; }
    .s-green { color: #4ade80; }
    .s-red   { color: #f87171; }

    .breakdown {
      background: var(--s1); border: 1px solid var(--border);
      border-radius: var(--r); overflow: hidden; margin-bottom: 24px;
    }
    .bd-hd {
      padding: 11px 18px; font-size: 0.68rem; font-weight: 700;
      letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--dim); border-bottom: 1px solid var(--border);
    }
    .bd-row {
      display: flex; align-items: center; gap: 12px;
      padding: 13px 18px; border-bottom: 1px solid var(--border);
    }
    .bd-row:last-child { border-bottom: none; }
    .bd-ico  { font-size: 1.1rem; flex-shrink: 0; }
    .bd-name { flex: 1; font-size: 0.84rem; font-weight: 600; }
    .bd-sc   { font-size: 0.84rem; font-weight: 700; color: var(--muted); }

    /* ── Confetti canvas ── */
    #cnf { position: fixed; inset: 0; pointer-events: none; z-index: 9999; }

    /* ── Small screen tweaks ── */
    @media (max-width: 380px) {
      .screen { padding: 12px 12px 40px; }
      .q-card { padding: 16px 14px; }
      .opt    { padding: 13px 14px; }
    }
  </style>
</head>
<body>

<div id="prog-track"><div id="prog-fill" style="width:0%"></div></div>
<div id="app"></div>
<canvas id="cnf"></canvas>

<script>
/* ==========================================================
   QUIZ DATA
   ========================================================== */
const SECTIONS = [
  {
    id:1, icon:"🔍",
    title:"Harmlos oder Dog Whistle?",
    desc:'Ein <em>Dog Whistle</em> ist ein Begriff, der harmlos klingt, aber eine versteckte politische Botschaft trägt. Erkennst du den Unterschied?',
    qs:[
      {
        type:"term", term:"Remigration",
        ctx:"Häufig verwendeter Begriff bei der AfD und in rechten Kreisen",
        opts:["Harmlos","Dog Whistle"], ans:1,
        expl:'„Remigration" klingt technisch-neutral, meint im rechten Kontext aber die massenhafte Abschiebung aller Menschen mit Migrationshintergrund – auch mit deutschem Pass. Das Wort verschleiert eine radikale Forderung hinter scheinbar sachlicher Sprache.'
      },
      {
        type:"term", term:"Heimat schützen",
        ctx:"Slogan der Identitären Bewegung und rechter Gruppen",
        opts:["Harmlos","Dog Whistle"], ans:1,
        expl:'„Heimat schützen" wirkt patriotisch und harmlos. Im Kontext der Neuen Rechten steht er für einen ethnonationalistischen Anspruch: Die ‚Heimat' soll vor Einwanderung und Vielfalt ‚geschützt' werden – eine Verschleierung von Ausgrenzung.'
      },
      {
        type:"term", term:"Umvolkung",
        ctx:"Verbreitet in Telegram-Kanälen und auf rechten Plattformen",
        opts:["Harmlos","Dog Whistle"], ans:1,
        expl:'„Umvolkung" ist ein Begriff aus der NS-Zeit und Kern der Verschwörungstheorie des ‚Großen Austauschs'. Er behauptet, die einheimische Bevölkerung werde durch Einwanderer ersetzt – eine gefährliche, antisemitische Lüge ohne faktische Grundlage.'
      },
      {
        type:"term", term:"Meinungsfreiheit",
        ctx:"Allgemeiner politischer Kontext, ohne spezifischen rechten Bezug",
        opts:["Harmlos","Dog Whistle"], ans:0,
        expl:'„Meinungsfreiheit" ist ein legitimes Grundrecht (Art. 5 GG) und in neutralem Kontext harmlos. Achtung: Rechte Gruppen instrumentalisieren diesen Begriff oft als Schutzschild für Hassrede. Kontext und Sprecher sind immer entscheidend!'
      },
      {
        type:"term", term:"Das Boot ist voll",
        ctx:"Metapher in der Migrationsdebatte – auf Plakaten und in Social Media",
        opts:["Harmlos","Dog Whistle"], ans:1,
        expl:'„Das Boot ist voll" stellt Deutschland als überfülltes Schiff dar, das keine Menschen mehr aufnehmen kann. Die Metapher dehumanisiert Geflüchtete und suggeriert, Hilfe sei unmöglich – ein klassisches Mittel rechter Propaganda.'
      }
    ]
  },
  {
    id:2, icon:"📱",
    title:"Welcher Kanal?",
    desc:'Ordne die Medien zu: Gehören sie zur <em>Neuen Rechten</em> oder zum <em>Mainstream-Journalismus</em>?',
    qs:[
      {
        type:"media",
        headline:"Telegram-Kanal mit tägl. 50.000 Aufrufen",
        detail:"Teilt täglich Gewaltvideos, Verschwörungstheorien und Desinformation – ohne Quellen, ohne Redaktion",
        opts:["Neue Rechte","Mainstream"], ans:0,
        expl:'Telegram ist die bevorzugte Plattform vieler rechtsextremer Netzwerke, da es kaum moderiert wird. Kanäle mit systematischer Desinformation und Hetze ohne redaktionelle Kontrolle sind typisch für die rechte Online-Medienlandschaft.'
      },
      {
        type:"media",
        headline:"Tagesschau Instagram",
        detail:"Offizieller Account der ARD-Nachrichtensendung mit täglichen Nachrichtenbeiträgen",
        opts:["Neue Rechte","Mainstream"], ans:1,
        expl:'Die Tagesschau gehört zum öffentlich-rechtlichen Journalismus der ARD. Solche Medien sind redaktionell rechenschaftspflichtig, dem Pressekodex verpflichtet und institutionell unabhängig – auch wenn sie kritisierbar sind.'
      },
      {
        type:"media",
        headline:'„Sezession" Magazin',
        detail:"Theoriezeitschrift des Instituts für Staatspolitik (IfS) von Götz Kubitschek",
        opts:["Neue Rechte","Mainstream"], ans:0,
        expl:'„Sezession" ist das Sprachrohr des IfS, das vom Verfassungsschutz als gesichert rechtsextrem eingestuft ist. Die Zeitschrift gibt rechtsextremen Ideen einen akademischen Anstrich – typisch für die Metapolitik der Neuen Rechten.'
      }
    ]
  },
  {
    id:3, icon:"🧩",
    title:"Strategie erkennen",
    desc:'Hinter rechten Aussagen stecken oft bestimmte <em>Rhetorik-Strategien</em>. Kannst du sie benennen?',
    qs:[
      {
        type:"quote",
        quote:'„Wir werden zensiert, diffamiert und verfolgt – nur weil wir unbequeme Wahrheiten aussprechen. Die Eliten und der Mainstream fürchten uns, weil wir das System herausfordern."',
        speaker:"— Fiktives Zitat, typisch für rechte Social-Media-Posts",
        opts:["Opfernarrativ","Euphemismus","Scheinakademische Sprache"], ans:0,
        expl:'Das Opfernarrativ stellt eine Gruppe als verfolgte Minderheit dar, obwohl sie oft selbst andere ausgrenzt und beleidigt. Dieses Muster dient dazu, Kritik abzuwehren, Anhänger zu emotionalisieren und eine ‚Wir gegen die'-Dynamik zu erzeugen.'
      },
      {
        type:"quote",
        quote:'„Wir fordern keine Massenabschiebungen – wir sprechen von der geordneten Rückführung in die Herkunftsländer, zum Wohle aller Beteiligten."',
        speaker:"— Fiktives Zitat, typisch für rechte Politiker-Statements",
        opts:["Opfernarrativ","Euphemismus","Scheinakademische Sprache"], ans:1,
        expl:'Euphemismen verschleiern brutale Forderungen hinter weichen Formulierungen. „Geordnete Rückführung" klingt bürokratisch und neutral, meint aber dasselbe wie Massenabschiebung. Sprache wird gezielt eingesetzt, um Radikalität zu verbergen.'
      },
      {
        type:"quote",
        quote:'„Aus ethnopluralistischer Sicht und unter Berücksichtigung metapolitischer Hegemonie nach Gramsci lässt sich eine kulturelle Reconquista als ideengeschichtlich notwendig ableiten."',
        speaker:"— Fiktives Zitat aus einem rechten ‚Theorietext'",
        opts:["Opfernarrativ","Euphemismus","Scheinakademische Sprache"], ans:2,
        expl:'Scheinakademische Sprache nutzt komplizierte Fachbegriffe, um rechtsextremen Ideen Seriosität zu verleihen. Begriffe wie „Ethnopluralismus" oder „metapolitisch" klingen wissenschaftlich, sind aber Vehikel für rechtsextreme Konzepte.'
      }
    ]
  }
];

const TOTAL = SECTIONS.reduce((a,s)=>a+s.qs.length,0); // 11

/* ==========================================================
   STATE
   ========================================================== */
let S = {si:0, qi:0, gIdx:0, score:0, ssc:[0,0,0]};
let answered = false;

/* ==========================================================
   RENDER ENGINE
   ========================================================== */
const appEl  = document.getElementById('app');
const progEl = document.getElementById('prog-fill');

function setProgress(n, of) {
  progEl.style.width = (n/of*100)+'%';
}

function mount(html) {
  const prev = appEl.querySelector('.screen');
  const next = document.createElement('div');
  next.className = 'screen anim-in';
  next.innerHTML = html;
  if (prev) {
    prev.classList.add('anim-out');
    prev.addEventListener('animationend', ()=>prev.remove(), {once:true});
  }
  appEl.appendChild(next);
}

/* ==========================================================
   SCREENS
   ========================================================== */
function showStart() {
  setProgress(0,1);
  const list = SECTIONS.map(s=>`
    <div class="sec-row">
      <span class="sec-row-icon">${s.icon}</span>
      <div>
        <div class="sec-row-name">${s.title}</div>
        <div class="sec-row-cnt">${s.qs.length} Fragen</div>
      </div>
      <span class="sec-row-badge">${s.qs.length}Q</span>
    </div>
  `).join('');

  mount(`<div class="sc">
    <div class="hero">
      <div class="eyebrow">🏫 Wandzeitung · Juni 2026</div>
      <h1>Sprache der<br><em>Neuen Rechten</em></h1>
      <p>Erkennst du Dog Whistles, rechte Medien<br>und rhetorische Strategien? Teste dein Wissen!</p>
    </div>
    <div class="sec-list">${list}</div>
    <button class="btn btn-red" onclick="startQuiz()">Quiz starten →</button>
  </div>`);
}

function showSecIntro() {
  const sec = SECTIONS[S.si];
  setProgress(S.gIdx, TOTAL);
  mount(`<div class="sc">
    <div class="si-wrap">
      <div class="si-step">Abschnitt ${S.si+1} von ${SECTIONS.length}</div>
      <div class="si-big">${sec.icon}</div>
      <h2 class="si-title">${sec.title}</h2>
      <p class="si-desc">${sec.desc}</p>
      <button class="btn btn-red" onclick="beginSection()">Los geht's →</button>
    </div>
  </div>`);
}

function showQuestion() {
  const sec = SECTIONS[S.si];
  const q   = sec.qs[S.qi];
  setProgress(S.gIdx, TOTAL);
  answered = false;

  const qc   = buildContent(q);
  const opts = q.opts.map((o,i)=>`
    <button class="opt" id="o${i}" onclick="pick(${i})">
      <span class="opt-lt">${String.fromCharCode(65+i)}</span>
      <span>${o}</span>
    </button>
  `).join('');

  mount(`<div class="sc">
    <div class="q-meta">
      <span class="q-tag">${sec.icon}&nbsp;${sec.title}</span>
      <span class="q-num">Frage ${S.gIdx+1}&thinsp;/&thinsp;${TOTAL}</span>
    </div>
    <div class="q-card">${qc}</div>
    <div class="opts">${opts}</div>
    <div id="fb-area"></div>
    <div id="nx-area"></div>
  </div>`);
}

function buildContent(q) {
  if (q.type==='term') return `
    <div class="q-lbl">Begriff einordnen</div>
    <div class="q-term">${q.term}</div>
    <div class="q-ctx">${q.ctx}</div>`;
  if (q.type==='media') return `
    <div class="q-lbl">Kanal einordnen</div>
    <div class="q-media">${q.headline}</div>
    <div class="q-detail">${q.detail}</div>`;
  return `
    <div class="q-lbl">Strategie erkennen</div>
    <div class="q-quote">${q.quote}</div>
    <div class="q-spkr">${q.speaker}</div>`;
}

function showResults() {
  setProgress(1,1);
  const sc = S.score;
  const [emoji,rtg] =
    sc>=8 ? ['🏆','Sprachprofi!'] :
    sc>=4 ? ['👍','Gut aufgepasst!'] :
            ['📚','Noch üben!'];
  const cls = sc>=8?'s-gold':sc>=4?'s-green':'s-red';

  const rows = SECTIONS.map((s,i)=>`
    <div class="bd-row">
      <span class="bd-ico">${s.icon}</span>
      <span class="bd-name">${s.title}</span>
      <span class="bd-sc">${S.ssc[i]}&thinsp;/&thinsp;${s.qs.length}</span>
    </div>`).join('');

  mount(`<div class="sc">
    <div class="res-hero">
      <div class="res-emoji">${emoji}</div>
      <div class="res-score ${cls}">${sc}<span class="res-sup"> / ${TOTAL}</span></div>
      <div class="res-rtg">${rtg}</div>
      <p class="res-sub">Du hast ${sc} von ${TOTAL} Fragen richtig beantwortet.</p>
    </div>
    <div class="breakdown">
      <div class="bd-hd">Deine Ergebnisse</div>
      ${rows}
    </div>
    <button class="btn btn-red" onclick="restart()">↺&ensp;Nochmal spielen</button>
  </div>`);

  if (sc>=4) setTimeout(launchConfetti, 400);
}

/* ==========================================================
   INTERACTIONS
   ========================================================== */
function startQuiz() {
  Object.assign(S,{si:0,qi:0,gIdx:0,score:0,ssc:[0,0,0]});
  showSecIntro();
}

function beginSection() { showQuestion(); }

function pick(i) {
  if (answered) return;
  answered = true;

  const sec = SECTIONS[S.si];
  const q   = sec.qs[S.qi];
  const ok  = i===q.ans;

  if (ok) { S.score++; S.ssc[S.si]++; }

  q.opts.forEach((_,j)=>{
    const b = document.getElementById('o'+j);
    if (!b) return;
    b.disabled = true;
    if (j===q.ans)      b.classList.add('c-ok');
    else if (j===i)     b.classList.add('c-bad');
    else                b.classList.add('c-dim');
  });

  const fbEl = document.getElementById('fb-area');
  if (fbEl) fbEl.innerHTML = `
    <div class="fb ${ok?'fb-ok':'fb-bad'}">
      <div class="fb-head">
        <span>${ok?'✓':'✗'}</span>
        <strong>${ok?'Richtig!':'Leider falsch.'}</strong>
      </div>
      <p class="fb-txt">${q.expl}</p>
    </div>`;

  const isLast = S.si===SECTIONS.length-1 && S.qi===sec.qs.length-1;
  const endSec = S.qi===sec.qs.length-1;
  const lbl = isLast?'Ergebnis anzeigen →':endSec?'Nächster Abschnitt →':'Weiter →';

  const nxEl = document.getElementById('nx-area');
  if (nxEl) nxEl.innerHTML = `
    <button class="btn btn-red" style="margin-top:6px" onclick="advance()">${lbl}</button>`;
}

function advance() {
  const sec = SECTIONS[S.si];
  S.gIdx++;
  if (S.qi < sec.qs.length-1) {
    S.qi++;
    showQuestion();
  } else if (S.si < SECTIONS.length-1) {
    S.si++;
    S.qi=0;
    showSecIntro();
  } else {
    showResults();
  }
}

function restart() {
  Object.assign(S,{si:0,qi:0,gIdx:0,score:0,ssc:[0,0,0]});
  showStart();
}

/* ==========================================================
   CONFETTI
   ========================================================== */
function launchConfetti() {
  const cv  = document.getElementById('cnf');
  if (!cv) return;
  const ctx = cv.getContext('2d');
  cv.width  = innerWidth;
  cv.height = innerHeight;

  const pal = ['#cc0000','#ffffff','#ff4444','#ffd700','#ff8800','#55cc55','#4488ff'];
  const pcs = Array.from({length:150}, ()=>({
    x:   Math.random()*cv.width,
    y:  -30 - Math.random()*240,
    vx:  (Math.random()-0.5)*5,
    vy:  1.5 + Math.random()*3.5,
    g:   0.055 + Math.random()*0.06,
    w:   5 + Math.random()*10,
    h:   3 + Math.random()*6,
    rot: Math.random()*360,
    rv:  (Math.random()-0.5)*9,
    col: pal[Math.floor(Math.random()*pal.length)]
  }));

  let raf;
  function draw() {
    ctx.clearRect(0,0,cv.width,cv.height);
    let live = false;
    for (const p of pcs) {
      if (p.y < cv.height+40) live=true;
      p.x+=p.vx; p.y+=p.vy; p.vy+=p.g; p.rot+=p.rv;
      const alpha = Math.max(0, 1 - p.y/cv.height*0.8);
      ctx.save();
      ctx.translate(p.x,p.y);
      ctx.rotate(p.rot*Math.PI/180);
      ctx.fillStyle=p.col; ctx.globalAlpha=alpha;
      ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
      ctx.restore();
    }
    if (live) raf=requestAnimationFrame(draw);
    else ctx.clearRect(0,0,cv.width,cv.height);
  }
  draw();
  setTimeout(()=>{ cancelAnimationFrame(raf); ctx.clearRect(0,0,cv.width,cv.height); },7000);
}

/* ==========================================================
   INIT
   ========================================================== */
showStart();
</script>
