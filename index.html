<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1a1a2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>🎮 Spiele</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { min-height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(160deg, #16213e 0%, #0f3460 100%);
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: calc(env(safe-area-inset-top) + 40px) 20px 40px;
    min-height: 100vh;
  }
  h1 {
    font-size: clamp(34px, 10vw, 56px);
    font-weight: 800;
    margin-bottom: 6px;
    background: linear-gradient(90deg, #ffd166, #ff6b6b, #4ecdc4);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .subtitle { opacity: 0.7; margin-bottom: 34px; font-size: 16px; }
  .games { width: 100%; max-width: 460px; display: flex; flex-direction: column; gap: 18px; }
  .card {
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 22px;
    border-radius: 18px;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.1);
    text-decoration: none;
    color: #fff;
    transition: transform 0.12s, background 0.2s;
  }
  .card:active { transform: scale(0.97); background: rgba(255,255,255,0.12); }
  .icon {
    font-size: 44px;
    width: 70px; height: 70px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 16px;
    flex-shrink: 0;
  }
  .icon.sky { background: linear-gradient(135deg, #16213e, #0f3460); }
  .icon.num { background: linear-gradient(135deg, #edc22e, #f59563); }
  .card .name { font-size: 22px; font-weight: 800; }
  .card .desc { font-size: 14px; opacity: 0.7; margin-top: 3px; }
  .arrow { margin-left: auto; font-size: 24px; opacity: 0.5; }
  .foot { margin-top: 40px; font-size: 13px; opacity: 0.5; text-align: center; line-height: 1.6; }
</style>
</head>
<body>
  <h1>Spiele</h1>
  <p class="subtitle">Wähle ein Spiel aus 👇</p>

  <div class="games">
    <a class="card" href="skyhopper.html">
      <div class="icon sky">🚀</div>
      <div>
        <div class="name">Sky Hopper</div>
        <div class="desc">Tippe, um die Rakete durch die Lücken zu fliegen</div>
      </div>
      <div class="arrow">›</div>
    </a>

    <a class="card" href="2048.html">
      <div class="icon num">🔢</div>
      <div>
        <div class="name">2048</div>
        <div class="desc">Wische Kacheln zusammen bis 2048</div>
      </div>
      <div class="arrow">›</div>
    </a>
  </div>

  <p class="foot">📱 Tipp: „Zum Home-Bildschirm" hinzufügen für Vollbild-Modus</p>
</body>
</html>
